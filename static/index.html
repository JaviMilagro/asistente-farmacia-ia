<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E9E5A">
  <meta name="robots" content="noindex">
  <title>Asistente virtual</title>
  <link rel="icon" type="image/svg+xml" href="/static/avatar.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
  <div id="app">
    <header class="cabecera">
      <div class="cabecera-in">
        <!-- Si existe avatar.mp4 en la raíz del proyecto, app.js sustituye la imagen por un vídeo en bucle (autoplay, muted, loop, playsinline) -->
        <div class="avatar-wrap" id="avatarCabecera">
          <img class="avatar" id="avatarImg" src="/static/avatar.svg" alt="" width="46" height="46">
        </div>
        <div class="titulos">
          <div class="titulo" id="titulo">Asistente virtual</div>
          <div class="subtitulo">Asistente virtual</div>
        </div>
      </div>
    </header>

    <main class="chat" id="chat" aria-live="polite">
      <div class="chat-in" id="chatIn"></div>
    </main>

    <footer class="pie" id="pie">
      <div class="pie-in">
        <p class="aviso-pie">Asistente en pruebas. Para dudas de salud, consulta con el farmacéutico.</p>
        <form class="entrada" id="form" autocomplete="off">
          <textarea id="texto" rows="1" maxlength="1000" placeholder="Escribe tu consulta…" aria-label="Escribe tu consulta"></textarea>
          <button type="submit" class="enviar" id="enviar" aria-label="Enviar" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </form>
      </div>
    </footer>

    <a class="whatsapp" id="whatsapp" hidden target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="#fff" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
    </a>

    <div class="acceso" id="acceso" hidden>
      <form class="acceso-caja" id="formAcceso">
        <img class="acceso-avatar" src="/static/avatar.svg" alt="" width="84" height="84">
        <h1 id="accesoTitulo">Hola</h1>
        <p id="accesoTexto">Introduce la contraseña de acceso.</p>
        <input type="password" id="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required>
        <button type="submit" class="btn-acceso">Entrar</button>
        <p class="error-acceso" id="errorAcceso" role="alert"></p>
      </form>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
